name: Nginx Static Update

on:
  push:
    paths:
      - 'nginx/static/**'
    branches: [main]
  workflow_dispatch:

jobs:
  sync-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync static files to server
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || '22' }}" \
            ./nginx/static/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/nginx/static/