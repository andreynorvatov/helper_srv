name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # - name: Clean server directory (keep .env only)
      #   run: |
      #     ssh -p ${{ secrets.SSH_PORT || '22' }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
      #       "cd ${{ secrets.DEPLOY_PATH }}/test_srv && \
      #        find . -maxdepth 1 ! -name '.env' ! -name '.' -exec rm -rf {} +"

      - name: Rsync code to server
        run: |
          rsync -avz --delete --exclude '.git' --exclude '.github' --exclude '.env' \
            -e "ssh -p ${{ secrets.SSH_PORT || '22' }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/test_srv

      - name: Create .env file on server
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::Secret OPENROUTER_API_KEY is empty or not set in GitHub Actions secrets — skipping .env creation"
            exit 0
          fi
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH/test_srv' && printf 'OPENROUTER_API_KEY=%s\n' '$OPENROUTER_API_KEY' > .env"

      - name: Deploy helper_srv via SSH
        run: |
          ssh -p ${{ secrets.SSH_PORT || '22' }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }}/test_srv && \
             docker compose down || true && \
             docker compose build --no-cache && \
             docker compose up -d"
