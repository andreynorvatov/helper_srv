# helper_srv — reverse proxy
upstream helper_backend {
    server helper_srv:8000;
}

server {
    listen 80;
    server_name _;

    # Статика — nginx отдаёт напрямую
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API — прокси на backend
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 10;
        proxy_pass http://helper_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё не-static и не-api — мусор (ботнет-сканер). Резать на 404 у nginx,
    # не гонять на backend.
    location / {
        return 404;
    }
}