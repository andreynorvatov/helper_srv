# helper_srv — reverse proxy
upstream helper_backend {
    server helper_srv:8000;
}

server {
    listen 80;
    server_name _;

    # Статика — nginx отдаёт напрямую
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API — прокси на backend
    location /api/ {
        proxy_pass http://helper_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное — тоже на backend (если есть не-API маршруты)
    location / {
        proxy_pass http://helper_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}