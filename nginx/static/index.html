<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helper Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #f0f6fc;
      letter-spacing: -0.5px;
    }
    .header p {
      color: #8b949e;
      font-size: 14px;
      margin-top: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card:hover {
      border-color: #58a6ff;
      background: #1c2333;
      transform: translateY(-2px);
    }
    .card .icon {
      font-size: 28px;
      line-height: 1;
    }
    .card .title {
      font-size: 18px;
      font-weight: 600;
      color: #f0f6fc;
    }
    .card .desc {
      font-size: 13px;
      color: #8b949e;
      line-height: 1.4;
    }
    .card .tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1f2937;
      color: #58a6ff;
      width: fit-content;
    }
    .tag.deg { background: #1e3a3f; color: #3fb950; }
    .tag.info { background: #1f2937; color: #58a6ff; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Helper Dashboard</h1>
    <p>Локальные сервисы и инструменты</p>
  </div>

  <div class="grid">
    <a class="card" href="/static/load_calculator/uz_load_calculator.html">
      <div class="icon">📊</div>
      <div class="title">Калькулятор нагрузки</div>
      <div class="desc">Расчёт показателей нагрузочного тестирования</div>
      <span class="tag deg">/deg/</span>
    </a>

    <a class="card" href="/static/openrouter_balance/or_balance.html">
      <div class="icon">💰</div>
      <div class="title">OpenRouter Balance</div>
      <div class="desc">Остаток средств на аккаунте OpenRouter</div>
      <span class="tag info">/info/</span>
    </a>

    <a class="card" href="/docs">
      <div class="icon">📖</div>
      <div class="title">API Docs (Swagger)</div>
      <div class="desc">Интерактивная документация API бэкенда</div>
      <span class="tag info">/docs/</span>
    </a>
  </div>
</body>
</html>
